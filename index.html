<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Plan Medicina</title>

<style>
body { font-family: Arial; background:#f3f4f6; padding:20px;}
h1 { font-size:28px; margin-bottom:20px;}
.grid { display:grid; grid-template-columns: repeat(3,1fr); gap:20px;}
.card { background:white; padding:15px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.materia { padding:10px; border-radius:10px; margin-bottom:5px; cursor:pointer; position:relative;}
.bloqueada { background:#d1d5db; cursor:not-allowed;}
.disponible { background:#bfdbfe;}
.cursando { background:#fde68a;}
.regular { background:#fed7aa;}
.aprobada { background:#86efac;}
.tooltip {
 position:absolute;
 bottom:100%;
 left:0;
 background:black;
 color:white;
 padding:5px;
 font-size:12px;
 border-radius:5px;
 display:none;
}
.materia:hover .tooltip { display:block; }
</style>

</head>
<body>

<h1>Plan de Estudios - Medicina (FIXED)</h1>
<div class="grid" id="app"></div>

<script>
const estados = ["bloqueada","disponible","cursando","regular","aprobada"];

const materias = {
"CBC": ["IPC","Sociedad y Estado","Química","Biofísica","Biología Celular","Matemática"],
"Primer Año": ["Anatomía","Histología","Embriología","Biología Molecular y Genética"],
"Segundo Año": ["Fisiología y Biofísica","Bioquímica","Inmunología","Microbiología"],
"Medicina": ["Medicina A","Patología","Farmacología I","Medicina Legal y Deontología","Toxicología","Farmacología II"],
"Clínicas": ["Medicina B","Nutrición","Dermatología","Infectología","Neumonología","Neurología","Diagnóstico por Imágenes","Psiquiatría"],
"Quirúrgicas": ["Pediatría","Obstetricia","Ginecología","Cirugía General","Urología","Ortopedia - Traumatología","Oftalmología","Otorrinolaringología","Neurocirugía"],
"Extras": ["Salud Mental","Salud Pública","Bioética","Inglés Técnico"],
"PFO": ["Medicina Familiar","Emergentología","Prácticas Comunitarias"]
};

let estado = JSON.parse(localStorage.getItem("estado")||"{}");

function getEstado(m){return estados[estado[m]]}
function aprobada(m){return getEstado(m)==="aprobada"}
function regular(m){return getEstado(m)==="regular"||getEstado(m)==="aprobada"}
function todasAprobadas(lista){return lista.every(m=>aprobada(m))}

function requisitosFaltantes(m){
 let faltan=[];

 if(materias["Primer Año"].includes(m)){
  materias["CBC"].forEach(x=>{if(!aprobada(x)) faltan.push(x)})
 }

 if(materias["Segundo Año"].includes(m)){
  if(!aprobada("Anatomía")) faltan.push("Anatomía");
  if(!aprobada("Histología")) faltan.push("Histología");
 }

 if(materias["Medicina"].includes(m)){
  [...materias["CBC"],...materias["Primer Año"],...materias["Segundo Año"]]
  .forEach(x=>{if(!aprobada(x)) faltan.push(x)})
 }

 if(materias["Clínicas"].includes(m) || materias["Quirúrgicas"].includes(m)){
  if(!aprobada("Medicina A")) faltan.push("Medicina A");
  if(!aprobada("Patología")) faltan.push("Patología");
 }

 if(m==="Psiquiatría" && !aprobada("Salud Mental")){
  faltan.push("Salud Mental");
 }

 if(materias["PFO"].includes(m)){
  [...materias["Clínicas"],...materias["Quirúrgicas"],...materias["Extras"]]
  .forEach(x=>{if(!aprobada(x)) faltan.push(x)})
 }

 return faltan;
}

function cumple(m){
 return requisitosFaltantes(m).length===0;
}

function guardar(){localStorage.setItem("estado",JSON.stringify(estado));}

function validarTodo(){
 let cambio=true;

 while(cambio){
  cambio=false;

  for(let bloque in materias){
    materias[bloque].forEach(m=>{
      if(estado[m]!==undefined && !cumple(m)){
        estado[m]=0;
        cambio=true;
      }
    })
  }
 }
}

function crearMateria(nombre){
 let habilitada=cumple(nombre);
 let est=estado[nombre] ?? (habilitada ? 1 : 0);

 let div=document.createElement("div");
 div.className="materia "+estados[est];
 div.innerText=nombre+" ("+estados[est]+")";

 let faltan = requisitosFaltantes(nombre);
 if(faltan.length>0){
  let tip=document.createElement("div");
  tip.className="tooltip";
  tip.innerText="Falta: "+faltan.join(", ");
  div.appendChild(tip);
 }

 if(habilitada){
  div.onclick=()=>{
   est=(est+1)%estados.length;
   estado[nombre]=est;
   validarTodo();
   guardar();
   render();
  }
 }

 return div;
}

function render(){
 validarTodo();

 const app=document.getElementById("app");
 app.innerHTML="";

 for(let bloque in materias){
  let card=document.createElement("div");
  card.className="card";

  let titulo=document.createElement("h3");
  titulo.innerText=bloque;
  card.appendChild(titulo);

  materias[bloque].forEach(m=>card.appendChild(crearMateria(m)));
  app.appendChild(card);
 }
}

render();
</script>

</body>
</html>
